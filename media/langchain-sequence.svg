<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="760" viewBox="0 0 1090 760" role="img" aria-labelledby="title desc">
<title id="title">An iMessage round trip through Photon, LangChain, and Ollama</title>
<desc id="desc">Photon delivers an incoming text to the local relay. The relay looks up history and starts the iMessage typing indicator. Its LangChain agent calls Qwen via Ollama. When generation ends, the relay clears typing and sends the answer through Photon to the original thread.</desc>
<defs><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7ee6dc"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b4c1d6"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f4c28b"/></marker></defs>
<rect width="1090" height="760" rx="20" fill="#101522"/>
<g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="20" y="24" width="240" height="66" rx="11" fill="#1d2a41"/>
<text x="140" y="51" fill="#f3f7ff" font-size="20" font-weight="700">iPhone</text>
<text x="140" y="74" fill="#b7c5d8" font-size="15">Messages</text>
<path d="M140 91V728" stroke="#44536b" stroke-dasharray="5 6"/>
<rect x="290" y="24" width="240" height="66" rx="11" fill="#1d2a41"/>
<text x="410" y="51" fill="#f3f7ff" font-size="20" font-weight="700">Photon Spectrum Cloud</text>
<text x="410" y="74" fill="#b7c5d8" font-size="15">Managed iMessage line</text>
<path d="M410 91V728" stroke="#44536b" stroke-dasharray="5 6"/>
<rect x="560" y="24" width="240" height="66" rx="11" fill="#1d2a41"/>
<text x="680" y="51" fill="#f3f7ff" font-size="20" font-weight="700">Relay + LangChain</text>
<text x="680" y="74" fill="#b7c5d8" font-size="15">Node.js on your Mac</text>
<path d="M680 91V728" stroke="#44536b" stroke-dasharray="5 6"/>
<rect x="830" y="24" width="240" height="66" rx="11" fill="#1d2a41"/>
<text x="950" y="51" fill="#f3f7ff" font-size="20" font-weight="700">Ollama</text>
<text x="950" y="74" fill="#b7c5d8" font-size="15">Local Qwen 3.5 9B</text>
<path d="M950 91V728" stroke="#44536b" stroke-dasharray="5 6"/>
<text x="275" y="132" fill="#f1f6ff" font-size="16">Send a text in Messages</text>
<path d="M140 144H410" stroke="#7ee6dc" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="545" y="188" fill="#f1f6ff" font-size="16">SDK stream: text + conversation</text>
<path d="M410 200H680" stroke="#7ee6dc" stroke-width="2" marker-end="url(#arrow-teal)"/>
<rect x="560" y="222" width="240" height="38" rx="7" fill="#273654"/>
<text x="680" y="247" fill="#e8efff" font-size="16">Check sender and load history</text>
<text x="545" y="287" fill="#f1f6ff" font-size="16">Start typing</text>
<path d="M680 299H410" stroke="#b4c1d6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-gray)"/>
<text x="275" y="332" fill="#f1f6ff" font-size="16">Show typing dots</text>
<path d="M410 344H140" stroke="#b4c1d6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-gray)"/>
<text x="815" y="388" fill="#f1f6ff" font-size="16">Generate with text + history</text>
<path d="M680 400H950" stroke="#7ee6dc" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="815" y="453" fill="#f1f6ff" font-size="16">Return Qwen’s answer</text>
<path d="M950 465H680" stroke="#f4c28b" stroke-width="2" marker-end="url(#arrow-gold)"/>
<text x="545" y="508" fill="#f1f6ff" font-size="16">Stop typing</text>
<path d="M680 520H410" stroke="#b4c1d6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-gray)"/>
<text x="275" y="553" fill="#f1f6ff" font-size="16">Clear typing dots</text>
<path d="M410 565H140" stroke="#b4c1d6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-gray)"/>
<text x="545" y="613" fill="#f1f6ff" font-size="16">Spectrum SDK: send the answer</text>
<path d="M680 625H410" stroke="#f4c28b" stroke-width="2" marker-end="url(#arrow-gold)"/>
<text x="275" y="669" fill="#f1f6ff" font-size="16">Reply in the same iMessage thread</text>
<path d="M410 681H140" stroke="#f4c28b" stroke-width="2" marker-end="url(#arrow-gold)"/>
<rect x="560" y="699" width="240" height="38" rx="7" fill="#273654"/>
<text x="680" y="724" fill="#e8efff" font-size="16">Save turn for the next message</text>
</g></svg>
